<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garagem FZ25</title>
<meta name="description" content="Manutenção da Yamaha Fazer FZ25 pelo manual: odômetro, checklists, histórico e combustível.">
<meta name="theme-color" content="#141618">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important} html,body{overscroll-behavior-y:none}</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Titillium+Web:wght@400;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (máx. 760px), seções empilhadas com espaçamento fixo de 20px, abas fixas embaixo para o polegar.
   Escala de espaço: 4 · 8 · 12 · 16 · 20 · 24. Tipografia: títulos em Saira Semi Condensed, texto em Figtree. */
:root{
  --bg:#141618; --panel:#1d2023; --panel2:#2a2e32; --line:#33383d;
  --fg:#eef1ea; --muted:#9aa29c; --accent:#b8e62a; --accent-ink:#172000;
  --ok:#9fdc2c; --warn:#ffb534; --crit:#ff5c55; --idle:#6b737a;
  --display:"Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bgimg:linear-gradient(transparent,transparent);
  --hero:linear-gradient(135deg,#2a2e32 0%,#1d2023 60%,rgba(184,230,42,.10) 100%);
  --r:16px; --r-sm:12px; --blur:0px; --glow:none; --txtglow:none; --hcase:none; --seg:none;
  --gap:20px;
  color-scheme:dark;
}
/* ---- FZ25 (padrão): cinza Titanium e verde da moto ---- */
:root[data-estilo="fz25"][data-modo="claro"]{--bg:#eceeeb;--panel:#ffffff;--panel2:#e4e7e3;--line:#d3d7d2;--fg:#191c1e;--muted:#5a625d;--accent:#5a8c00;--accent-ink:#ffffff;--ok:#4c8700;--warn:#a96700;--crit:#cf362f;--idle:#949c96;
  --bgimg:linear-gradient(170deg,#f5f6f4 0%,#eceeeb 55%);--hero:linear-gradient(135deg,#ffffff 0%,#f3f5f1 60%,rgba(140,190,20,.16) 100%);color-scheme:light}
/* ---- Original (cockpit azul) ---- */
:root[data-estilo="original"]{--display:"Chakra Petch",system-ui,sans-serif}
:root[data-estilo="original"][data-modo="escuro"]{--bg:#0d1114;--panel:#151b20;--panel2:#1c242b;--line:#28323b;--fg:#e8eef2;--muted:#8a99a6;--accent:#4fd6ec;--accent-ink:#06262c;--ok:#46d48a;--warn:#ffb340;--crit:#ff5a5f;--idle:#6c7a86;--hero:linear-gradient(160deg,#1c242b,#151b20)}
:root[data-estilo="original"][data-modo="claro"]{--bg:#eef2f5;--panel:#ffffff;--panel2:#e6ecf0;--line:#d5dee5;--fg:#12181d;--muted:#5d6b77;--accent:#0a8ea3;--accent-ink:#ffffff;--ok:#1f9d5c;--warn:#c27c00;--crit:#d93a3f;--idle:#8795a1;--hero:var(--panel);color-scheme:light}
/* ---- Aurora ---- */
:root[data-estilo="aurora"]{--display:"Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;--r:20px;--r-sm:16px;--blur:16px}
:root[data-estilo="aurora"][data-modo="escuro"]{--bg:#0b0a1a;--panel:rgba(32,28,64,.55);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.10);--fg:#f2f0fb;--muted:#a6a2c4;--accent:#8b5cf6;--accent-ink:#ffffff;--ok:#4ade80;--warn:#fbbf24;--crit:#f87171;--idle:#7d7999;
  --bgimg:radial-gradient(ellipse 90% 60% at 85% 0%,rgba(124,58,237,.40),transparent 60%),radial-gradient(ellipse 70% 50% at 0% 100%,rgba(76,29,149,.45),transparent 60%);--hero:linear-gradient(150deg,rgba(139,92,246,.28),rgba(32,28,64,.55));--glow:0 8px 30px rgba(0,0,0,.35)}
:root[data-estilo="aurora"][data-modo="claro"]{--bg:#f3f1fb;--panel:rgba(255,255,255,.8);--panel2:#ebe7f8;--line:#ddd8f0;--fg:#1d1a33;--muted:#615d7c;--accent:#7c3aed;--accent-ink:#ffffff;--ok:#16a34a;--warn:#b06600;--crit:#dc2626;--idle:#9a96b0;
  --bgimg:radial-gradient(ellipse 90% 60% at 85% 0%,rgba(167,139,250,.35),transparent 60%),radial-gradient(ellipse 70% 50% at 0% 100%,rgba(196,181,253,.40),transparent 60%);--hero:linear-gradient(150deg,rgba(139,92,246,.16),rgba(255,255,255,.8));--glow:0 8px 24px rgba(76,29,149,.08);color-scheme:light}
/* ---- Pista ---- */
:root[data-estilo="pista"]{--display:"Titillium Web",system-ui,sans-serif;--body:"Titillium Web",system-ui,sans-serif;--r:6px;--r-sm:4px;--hcase:uppercase;--seg:repeating-linear-gradient(90deg,#000 0 16px,transparent 16px 20px)}
:root[data-estilo="pista"][data-modo="escuro"]{--bg:#050505;--panel:#0d0d0d;--panel2:#1d1d1d;--line:#262626;--fg:#ffffff;--muted:#9a9a9a;--accent:#ff1e1e;--accent-ink:#ffffff;--ok:#2fd27e;--warn:#ffb800;--crit:#ff1e1e;--idle:#5c5c5c;--hero:var(--panel)}
:root[data-estilo="pista"][data-modo="claro"]{--bg:#f4f4f4;--panel:#ffffff;--panel2:#e6e6e6;--line:#dcdcdc;--fg:#0a0a0a;--muted:#5f5f5f;--accent:#e10600;--accent-ink:#ffffff;--ok:#0f9d58;--warn:#b07000;--crit:#e10600;--idle:#a3a3a3;--hero:var(--panel);color-scheme:light}
/* ---- Neon ---- */
:root[data-estilo="neon"]{--display:"Orbitron",system-ui,sans-serif;--body:"Rajdhani",system-ui,sans-serif;--r:4px;--r-sm:3px;--hcase:uppercase}
:root[data-estilo="neon"][data-modo="escuro"]{--bg:#030603;--panel:#060b06;--panel2:#0f1a0c;--line:#22401a;--fg:#e8ffd4;--muted:#83a073;--accent:#a6ff00;--accent-ink:#0a1400;--ok:#a6ff00;--warn:#ffd23f;--crit:#ff4d4d;--idle:#4f6645;
  --bgimg:linear-gradient(rgba(166,255,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(166,255,0,.035) 1px,transparent 1px);--glow:0 0 18px rgba(166,255,0,.07);--txtglow:0 0 14px rgba(166,255,0,.55);--hero:var(--panel)}
:root[data-estilo="neon"][data-modo="claro"]{--bg:#f1f6ea;--panel:#ffffff;--panel2:#e5efd9;--line:#c6d9b0;--fg:#132010;--muted:#55694a;--accent:#3d8b00;--accent-ink:#ffffff;--ok:#3d8b00;--warn:#9a6600;--crit:#cf2a2a;--idle:#93a586;
  --bgimg:linear-gradient(rgba(61,139,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(61,139,0,.06) 1px,transparent 1px);--hero:var(--panel);color-scheme:light}
:root[data-estilo="neon"] body{background-size:28px 28px}

/* ---- base ---- */
*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg)}
body{background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--fg);
  font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 104px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap)}
#view{display:flex;flex-direction:column;gap:var(--gap)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700;line-height:1.2}
h2{font-size:19px;letter-spacing:.01em;text-transform:var(--hcase)}
h3{font-size:16px;letter-spacing:.01em}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* seção = título + conteúdo */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:36px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.04em;white-space:nowrap;line-height:1.1}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.on{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.err{background:var(--crit)}

/* superfícies */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--glow);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));min-width:0}
.card.flat{padding:0;overflow:hidden}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.banner{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r-sm);padding:12px 16px;font-size:14px}

/* perfil + odômetro */
.perfil{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--hero);overflow:hidden}
.perfil img{width:128px;height:auto;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.perfil-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.perfil-t b{font-family:var(--display);font-size:22px;line-height:1.15}
.hud{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--hero)}
.hud-l{display:flex;flex-direction:column;gap:8px;min-width:0}
.odo{font-family:var(--display);font-size:clamp(40px,12vw,58px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:var(--txtglow)}
.odo small{font-size:.36em;color:var(--muted);margin-left:6px;font-weight:600}
.odo-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.odo-meta b{color:var(--fg);font-weight:600}
.kmform{display:flex;gap:8px}
.kmform input{flex:1;min-width:0}
.gauge{position:relative;width:112px;height:112px}
.gauge svg{width:100%;height:100%;display:block}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.gauge .v span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}

.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:var(--glow)}
.count b{font-family:var(--display);font-size:26px;line-height:1.1}
.count span{font-size:12px;color:var(--muted);line-height:1.3}
.count.crit b{color:var(--crit)} .count.warn b{color:var(--warn)} .count.ok b{color:var(--ok)} .count.idle b{color:var(--idle)}

/* barras */
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;-webkit-mask:var(--seg);mask:var(--seg)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.idle{background:var(--idle)}
:root[data-estilo="pista"] .bar{height:10px;border-radius:0} :root[data-estilo="pista"] .bar i{border-radius:0}

/* manutenção: grade de cards pequenos */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);flex:none}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:38px;height:38px;border-radius:11px} .ic.lg svg{width:22px;height:22px}
.ic.sm{width:28px;height:28px;border-radius:8px;background:var(--panel2);color:var(--muted);margin-top:2px} .ic.sm svg{width:16px;height:16px}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;width:100%}
.tile.crit .ic{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.tile.warn .ic{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tile.idle .ic{color:var(--muted);background:var(--panel2)}
.graf{width:100%;height:auto;display:block;overflow:visible}
.blks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;color:var(--fg);font:inherit;cursor:pointer;position:relative;overflow:hidden;min-width:0;box-shadow:var(--glow)}
.blk::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--idle)}
.blk.crit::before{background:var(--crit)} .blk.warn::before{background:var(--warn)} .blk.ok::before{background:var(--ok)}
.blk.crit .ic{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)} .blk.warn .ic{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)} .blk.idle .ic{color:var(--muted);background:var(--panel2)}
.blk .bn{font-size:12px;font-weight:600;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .bv{font-family:var(--display);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.blk.crit .bv{color:var(--crit)} .blk.idle .bv{color:var(--muted);font-size:13px}
.lins{display:flex;flex-direction:column}
.lin{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px 8px 10px;border:0;border-bottom:1px solid var(--line);border-left:3px solid var(--idle);background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.lin:last-child{border-bottom:0}
.lin.crit{border-left-color:var(--crit)} .lin.warn{border-left-color:var(--warn)} .lin.ok{border-left-color:var(--ok)}
.lin .ic.sm{margin:0}
.lin .ln{display:flex;flex-direction:column;gap:4px;min-width:0}
.lin .ln b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .bar{height:4px}
.lin .lv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.lin .lv b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.lin.crit .lv b{color:var(--crit)} .lin.idle .lv b{color:var(--muted);font-size:13px}
.lin .lv small{font-size:11px;color:var(--muted)}
button.tile,button.card{color:var(--fg);font:inherit;width:100%;cursor:pointer}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;box-shadow:var(--glow);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--idle)}
.tile.crit::before{background:var(--crit)} .tile.warn::before{background:var(--warn)} .tile.ok::before{background:var(--ok)}
.tile .tn{font-weight:600;font-size:14px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tv{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.crit .tv{color:var(--crit)} .tile.idle .tv{color:var(--muted);font-size:17px}
.tile .ts{font-size:12px;color:var(--muted);line-height:1.35}
.st-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-dot.crit{color:var(--crit)} .st-dot.warn{color:var(--warn)} .st-dot.ok{color:var(--ok)} .st-dot.idle{color:var(--idle)}

/* manutenção: lista */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--idle);box-shadow:var(--glow);min-width:0}
.item.crit{border-left-color:var(--crit)} .item.warn{border-left-color:var(--warn)} .item.ok{border-left-color:var(--ok)}
.item.foco{outline:2px solid var(--accent);outline-offset:2px}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item-h h3{text-transform:var(--hcase)}
.sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px;white-space:nowrap;color:var(--idle);border:1px solid var(--line);line-height:1}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.item-f{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted)}
.item-f b{color:var(--fg);font-weight:600}
.spec{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;line-height:1.5}
.tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:4px;background:var(--panel2);color:var(--muted);margin-left:6px;vertical-align:2px;line-height:1}
.tag.est{color:var(--warn)}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:12px;padding:0 18px;font-weight:700;font-size:15px;font-family:var(--body);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.icon{min-width:44px;padding:0;font-size:20px}
.btn.icon.sm{min-width:36px}
.btn.danger{background:transparent;color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:44px;width:100%;min-width:0;font-size:16px}
textarea{padding:10px 14px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.check{flex-direction:row;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--fg)}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:0 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip .x{font-size:16px;line-height:1;opacity:.75}
.msg{font-size:14px;color:var(--warn)} .msg.okm{color:var(--ok)}
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;background:transparent;border:0;border-radius:10px;padding:0 10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.seg.mini{padding:3px;border-radius:12px}
.seg.mini button{min-height:32px;padding:0 10px;font-size:13px}
.seg.vt button{width:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.seg.vt svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* autocompletar */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);overflow:hidden;max-height:300px;overflow-y:auto}
.ac-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font-size:15px}
.ac-list button:last-child{border-bottom:0}
.ac-list button:hover,.ac-list button.on{background:var(--panel2)}
.ac-list small{color:var(--muted);font-size:12px;white-space:nowrap}

/* checklists / hábitos */
.pernav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.pernav .t{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.ck{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ck .tx b{font-weight:600;line-height:1.35}
.ck .tx span{font-size:14px;color:var(--muted)}
.ck .tx .val{color:var(--accent);font-weight:600}
.ck input[type=checkbox]{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--accent);margin:0}
.hb{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .12s}
.hb.lg{width:32px;height:32px}
.hb svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hb.ok{background:var(--ok);border-color:var(--ok)} .hb.ok svg{stroke:var(--bg)}
.hb.nao{background:var(--crit);border-color:var(--crit)}
.hb.miss{border-color:color-mix(in srgb,var(--crit) 55%,transparent);border-style:dashed}
.hb.fut{opacity:.25;cursor:default}
.hb:active{transform:scale(.88)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{font-weight:700}
.hab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hab{border-collapse:collapse;width:100%;font-size:13px}
.hab th,.hab td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.hab thead th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hab thead th button{background:none;border:0;color:inherit;font:inherit;padding:2px 4px;border-radius:6px}
.hab th.hn{text-align:left;font-weight:500;font-size:13px;line-height:1.3;min-width:120px;max-width:150px;padding-left:16px;position:sticky;left:0;background:var(--panel);z-index:1}
.hab thead th.hn,.hab tfoot th.hn{font-weight:700;color:var(--muted);font-size:12px}
.hab .cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hab thead th.cur{color:var(--accent)}
.hab .pc{color:var(--muted);font-size:12px;padding-right:16px;white-space:nowrap}
.hab tfoot td,.hab tfoot th{border-bottom:0}
.streak{display:block;font-size:11px;color:var(--ok);font-weight:700}

/* histórico e listas de registro */
.hist{display:flex;flex-direction:column}
.h{display:grid;grid-template-columns:76px 1fr auto;gap:4px 12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.h:last-child{border-bottom:0}
.h .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.4}
.h .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.h .t b{font-weight:600;line-height:1.35}
.h .t span{font-size:13px;color:var(--muted)}
.h .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.h .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{text-align:center;padding:24px 16px;color:var(--muted);font-size:14px}

/* resumo anual */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel2);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:110px;padding-top:8px}
.mbars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mbars i{display:block;width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px}
.mbars i.zero{background:var(--line)}
.mbars span{font-size:10px;color:var(--muted);text-transform:uppercase}
.rank{display:flex;flex-direction:column;gap:8px}
.rank div{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.rank .bar{grid-column:1/-1}

.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec-b{background:var(--panel2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.spec-b span{font-size:12px;color:var(--muted)}
.spec-b b{font-weight:600;font-size:15px;overflow-wrap:anywhere}

/* seletor de estilo */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tm{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tm b{font-size:15px} .tm span{font-size:13px;color:var(--muted)}
.sw{display:flex;gap:4px}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}

/* abas inferiores */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--panel)}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:4px 0}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
@media (max-width:460px){#syncTxt{display:none}}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.count b{font-size:22px}.gauge{width:96px;height:96px}.gauge .v b{font-size:23px}.perfil img{width:112px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}

const hoje = () => isoOf(new Date());
const toD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const diasEntre = (a,b) => Math.round((toD(b)-toD(a))/864e5);
const addMeses = (s,m) => { const d=toD(s); d.setMonth(d.getMonth()+m); return isoOf(d); };
const addDias = (s,n) => { const d=toD(s); d.setDate(d.getDate()+n); return isoOf(d); };
const mesAdd = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const fmtD = s => s? toD(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
const fmtDM = s => { const d=toD(s); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); };
const fmtKm = n => n==null||isNaN(n)?'—':Math.round(n).toLocaleString('pt-BR');
const fmtR = n => 'R$ '+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtR0 = n => 'R$ '+Math.round(n||0).toLocaleString('pt-BR');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

const plural = (n,s,p) => n+' '+(n===1?s:p);

function kmAtual(){ if(!S.leituras.length) return null; return S.leituras.reduce((a,l)=>l.km>a?l.km:a,0); }
function kmPorDia(){
  const L=[...S.leituras].sort((a,b)=>a.data<b.data?-1:1);
  if(L.length>=2){ const a=L[0], b=L[L.length-1]; const d=diasEntre(a.data,b.data); if(d>=5 && b.km>a.km) return (b.km-a.km)/d; }
  return S.moto.kmMes? S.moto.kmMes/30.44 : null;
}
function intervalo(it){ const o=S.intervalos[it.id]||{}; return {km:o.km!==undefined?o.km:it.km, kmMax:o.kmMax||null, meses:o.meses!==undefined?o.meses:it.meses}; }

/* ============ MOTOR DE STATUS ============ */
function status(it){
  const km=kmAtual(), kd=kmPorDia(), iv=intervalo(it), H=hoje();
  const regs=S.servicos.filter(s=>s.itens.includes(it.id)).sort((a,b)=>(b.km||0)-(a.km||0)||(a.data<b.data?1:-1));
  const ult=regs[0]||null;
  let proxKm=null, proxData=null, estimado=false, semReg=false;
  if(ult){
    if(iv.km) proxKm=(ult.km||0)+iv.km;
    if(iv.meses) proxData=addMeses(ult.data,iv.meses);
  } else if(it.fonte==='manual' && iv.km && km!=null){
    estimado=true; // sem registro: usa a grade da tabela (1.000 km e depois múltiplos do intervalo)
    if(it.primeiro && km<it.primeiro) proxKm=it.primeiro;
    else { proxKm=Math.floor(km/iv.km)*iv.km+iv.km; if(km%iv.km===0) proxKm=km; }
  } else semReg=true;
  const restKm = proxKm!=null && km!=null ? proxKm-km : null;
  // faixa de troca (ex.: de 3.000 a 5.000 km): a partir do mínimo avisa, passou do máximo fica atrasado
  const limKm = iv.kmMax&&proxKm!=null&&iv.kmMax>iv.km ? proxKm-iv.km+iv.kmMax : null;
  const restMax = limKm!=null&&km!=null ? limKm-km : null;
  const janela = restMax!=null && restKm<=0 && restMax>=0;
  const restDias = proxData ? diasEntre(H,proxData) : null;
  let prevista=null;
  if(restKm!=null && kd) prevista=addDias(H,Math.max(0,Math.round(restKm/kd)));
  if(proxData && (!prevista || proxData<prevista)) prevista=proxData;
  let frac=null;
  if(ult){
    const fk = iv.km && km!=null ? (km-(ult.km||0))/(iv.kmMax&&iv.kmMax>iv.km?iv.kmMax:iv.km) : null;
    const ft = iv.meses ? diasEntre(ult.data,H)/(iv.meses*30.44) : null;
    frac=Math.max(fk??0, ft??0);
  } else if(estimado && iv.km){ frac=1-(restKm/iv.km); }
  let st='idle';
  if(!semReg && frac!=null){
    const atrasado=(restMax!=null?restMax<0:(restKm!=null&&restKm<0))||(restDias!=null&&restDias<0);
    const breve=janela||frac>=0.85||(restDias!=null&&restDias<=30)||(restKm!=null&&kd&&restKm/kd<=7);
    st=atrasado?'crit':breve?'warn':'ok';
  }
  return {it,iv,ult,proxKm,limKm,proxData,restKm,restMax,janela,restDias,prevista,frac,st,estimado,semReg,n:regs.length};
}
const ORD={crit:0,warn:1,ok:2,idle:3};
const STNOME={crit:'Atrasado',warn:'Em breve',ok:'Em dia',idle:'Sem registro'};
function todos(){ return ITENS.map(status).sort((a,b)=>ORD[a.st]-ORD[b.st]||((b.frac??-1)-(a.frac??-1))); }
function ivTexto(iv){ return [iv.km?(iv.kmMax&&iv.kmMax>iv.km?fmtKm(iv.km)+' a '+fmtKm(iv.kmMax):fmtKm(iv.km))+' km':null, iv.meses?(iv.meses%12===0?(iv.meses/12)+(iv.meses===12?' ano':' anos'):iv.meses+' meses'):null].filter(Boolean).join(' ou '); }

/* ============ GRÁFICO DE DESEMPENHO ============ */
function serieDesempenho(t,n){
  const atual=perAtual(t), ini=inicioHab(t), C=CHECKLISTS[t];
  const P=[]; let k=atual; for(let i=0;i<n;i++){ P.unshift(k); k=perMove(t,k,-1); }
  return P.map(p=>{ if(p<ini) return {p,v:null}; const vs=C.itens.map(i=>habGet(t,p,i.id)); if(p===atual&&vs.some(v=>!v)) return {p,v:null}; return {p,v:Math.round(vs.filter(v=>v==='ok').length/C.itens.length*100)}; });
}
function grafico(t,compacto){

  const un=t==='semanal'?'semanas':'meses';
  if(pts.length<2) return `<p class="small muted">O gráfico aparece quando houver pelo menos 2 ${un} marcadas. Ele mostra a % de itens feitos em cada ${t==='semanal'?'semana':'mês'}.</p>`;

  const x=i=>L+i*(w/(n-1)), y=v=>T+hh-(v/100)*hh;
  const seg=[]; let cur=[]; D.forEach((d,i)=>{ if(d.v==null){ if(cur.length) seg.push(cur); cur=[]; } else cur.push([x(i),y(d.v)]); }); if(cur.length) seg.push(cur);
  const linha=seg.map(s=>'M'+s.map(q=>q.map(z=>z.toFixed(1)).join(',')).join('L')).join('');
  const area=seg.filter(s=>s.length>1).map(s=>`M${s[0][0].toFixed(1)},${(T+hh)}L`+s.map(q=>q.map(z=>z.toFixed(1)).join(',')).join('L')+`L${s[s.length-1][0].toFixed(1)},${T+hh}Z`).join('');
  const lastI=D.map(d=>d.v!=null).lastIndexOf(true), last=D[lastI];
  const media=Math.round(pts.reduce((a,d)=>a+d.v,0)/pts.length);
  const rec=pts.slice(-4), ant=pts.slice(-8,-4); const tend=ant.length?Math.round(rec.reduce((a,d)=>a+d.v,0)/rec.length-ant.reduce((a,d)=>a+d.v,0)/ant.length):null;
  const lbl=p=>t==='semanal'?fmtDM(p):MESES[+p.slice(5,7)-1]+(p.slice(5,7)==='01'?'/'+p.slice(2,4):'');
  const gid='g'+t+(compacto?'c':'');
  return `<div class="between"><div class="row" style="gap:20px;flex-wrap:nowrap"><div><b class="num" style="font-size:24px">${last.v}%</b><div class="xs muted">${t==='semanal'?'última semana':'último mês'}</div></div><div><b class="num" style="font-size:24px">${media}%</b><div class="xs muted">média de ${plural(pts.length,t==='semanal'?'semana':'mês',un)}</div></div></div>
    ${tend!=null?`<span class="pill ${tend>=0?'ok':'warn'}">${tend>=0?'▲':'▼'} ${Math.abs(tend)} pts</span>`:''}</div>
  <svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Constância ${t} nas últimas ${n} ${un}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v?'stroke-dasharray="3 4"':''}/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${linha}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${D.map((d,i)=>d.v==null?'':`<circle cx="${x(i)}" cy="${y(d.v)}" r="${i===lastI?5:3}" fill="${i===lastI?'var(--accent)':'var(--panel)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    ${D.map((d,i)=>(i%(compacto?3:2)===(n-1)%(compacto?3:2))?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${lbl(d.p)}</text>`:'').join('')}
  </svg>`;
}
/* ============ RASTREADOR DE HÁBITOS (semanal e mensal) ============ */
function segunda(iso){ const d=toD(iso); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoOf(d); }
function perAtual(t){ return t==='semanal'?segunda(hoje()):hoje().slice(0,7); }
function perVer(t){ return ui.per[t]||perAtual(t); }
function perMove(t,k,n){ return t==='semanal'?addDias(k,7*n):mesAdd(k,n); }
function perFim(t,k){ if(t==='semanal') return addDias(k,6); const [y,m]=k.split('-').map(Number); return isoOf(new Date(y,m,0)); }
function perTitulo(t,k){ if(t==='semanal'){ const f=perFim(t,k); return `Semana de ${fmtDM(k)} a ${fmtDM(f)}`; } return `${MESES_L[+k.slice(5,7)-1]} de ${k.slice(0,4)}`.replace(/^./,c=>c.toUpperCase()); }
const habGet=(t,k,i)=>((S.hab[t]||{})[k]||{})[i];
function habSet(t,k,i,v){
  S.hab[t]=S.hab[t]||{}; const P=S.hab[t][k]=S.hab[t][k]||{};
  if(v) P[i]=v; else delete P[i];
  if(!Object.keys(P).length) delete S.hab[t][k];
  const it=CHECKLISTS[t].itens.find(x=>x.id===i), sid=`hab-${t}-${k}-${i}`;
  if(it&&it.liga){ // lubrificar corrente entra no histórico quando fica verde
    S.servicos=S.servicos.filter(s=>s.id!==sid);
    if(v==='ok'){ const atual=k===perAtual(t), fim=perFim(t,k);
      S.servicos.push({id:sid,itens:[it.liga],data:atual?hoje():(fim<hoje()?fim:hoje()),km:atual?kmAtual():null,custo:0,local:'Eu mesmo',obs:'Pelo checklist '+CHECKLISTS[t].nome.toLowerCase(),outro:''}); }
  }
}
const proxEstado=v=>!v?'ok':v==='ok'?'nao':null;
function habStatus(t,k){
  k=k||perAtual(t);
  const C=CHECKLISTS[t], n=C.itens.length, atual=perAtual(t);
  const ok=C.itens.filter(i=>habGet(t,k,i.id)==='ok').length, nao=C.itens.filter(i=>habGet(t,k,i.id)==='nao').length, pend=n-ok-nao;
  let prazo='', st;
  if(k===atual){ const r=diasEntre(hoje(),perFim(t,k)); prazo=r===0?'Último dia':`Restam ${plural(r,'dia','dias')}`; st=pend===0?(nao?'warn':'ok'):r<=(t==='semanal'?1:5)?'warn':'idle'; }
  else if(k<atual){ prazo=t==='semanal'?'Semana encerrada':'Mês encerrado'; st=pend?'crit':nao?'warn':'ok'; }
  else { prazo=`Começa em ${fmtDM(t==='semanal'?k:k+'-01')}`; st='idle'; }
  const txt=`${plural(ok,'feita','feitas')}${nao?' · '+nao+' não '+(nao===1?'feita':'feitas'):''}${pend?' · '+plural(pend,'pendente','pendentes'):''}`;
  return {st,ok,nao,pend,n,pct:ok/n*100,prazo,txt};
}
let recentes={}; // tarefa recém-marcada fica visível 1,6 s para dar tempo do segundo toque
function bolinha(t,k,i,v,miss,grande,fut){
  if(fut) return `<span class="hb fut" aria-hidden="true"></span>`;
  const nome={ok:'feito',nao:'não feito'}[v]||(miss?'não marcado':'pendente');
  return `<button class="hb ${v||''} ${!v&&miss?'miss':''} ${grande?'lg':''}" data-act="hab" data-t="${t}" data-k="${k}" data-i="${i}" aria-label="${nome}">${v==='ok'?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':v==='nao'?'<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>':''}</button>`;
}
function inicioHab(t){ return Object.keys(S.hab[t]||{}).sort()[0]||perAtual(t); }
function rHabito(t){
  const C=CHECKLISTS[t], k=perVer(t), atual=perAtual(t), agora=Date.now();

  const hs=habStatus(t,k), un=t==='semanal'?'semana':'mês';
  let h=`<div class="card stack" data-swipe="${t}">

    <div class="legend"><span>1 toque: <b style="color:var(--ok)">feito</b></span><span>2 toques: <b style="color:var(--crit)">não fiz</b></span><span>3 toques: pendente</span><span>Arraste para o lado para trocar de ${un}</span></div>
    <div>${pend.map(i=>`<div class="ck">${bolinha(t,k,i.id,habGet(t,k,i.id),false,true)}${ico(ICONE_CK[i.id]||"check","sm")}<div class="tx"><b>${esc(i.t)}</b>${i.v?`<span class="val">${esc(i.v)}</span>`:''}</div></div>`).join('')||`<div class="empty">Tudo marcado ${t==='semanal'?'nesta semana':'neste mês'}.</div>`}</div>
    ${marc.length?`<details><summary>Marcadas (${marc.length})</summary><div>${marc.map(i=>`<div class="ck">${bolinha(t,k,i.id,habGet(t,k,i.id))}<div class="tx"><b>${esc(i.t)}</b></div></div>`).join('')}</div></details>`:''}

  if(ui.tarEdit===t) h+=editorTarefas(t);

  const ini=inicioHab(t);
  const g=ui.grid[t]||(t==='semanal'?k.slice(0,7):k.slice(0,4));
  let P=[];
  if(t==='semanal'){ let d=segunda(g+'-01'); if(d.slice(0,7)<g) d=addDias(d,7); while(d.slice(0,7)===g){ P.push(d); d=addDias(d,7); } }
  else { for(let m=1;m<=12;m++) P.push(g+'-'+String(m).padStart(2,'0')); }
  const linhas=C.itens.map(i=>{
    let ok=0,tot=0;
    P.forEach(p=>{ if(p<ini||p>atual) return; const v=habGet(t,p,i.id); if(p!==atual||v){ tot++; if(v==='ok') ok++; } });

  const colPct=P.map(p=>{ if(p<ini||p>atual) return null; const vs=C.itens.map(i=>habGet(t,p,i.id)); if(p===atual&&!vs.some(Boolean)) return null; return Math.round(vs.filter(v=>v==='ok').length/C.itens.length*100); });
  const valid=colPct.filter(v=>v!=null); const media=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):null;
  const gTit=t==='semanal'?`${MESES_L[+g.slice(5,7)-1]} ${g.slice(0,4)}`.replace(/^./,c=>c.toUpperCase()):g;
  const lbl=p=>t==='semanal'?fmtDM(p):MESES[+p.slice(5,7)-1];
  h+=`<section class="sec"><div class="sec-h"><h2>Histórico</h2><span class="small muted">Constância <b class="num" style="color:var(--accent)">${media==null?'—':media+'%'}</b></span></div>
  <div class="card flat">

      <div class="t"><b>${gTit}</b><span class="xs muted">${t==='semanal'?'Semanas do mês':'Meses do ano'} · toque no título da coluna para abrir</span></div>
      <button class="btn icon sm ghost" data-act="grid" data-t="${t}" data-d="1" aria-label="Próximo">›</button></div>
    <div class="hab-wrap"><table class="hab"><thead><tr><th class="hn">${t==='semanal'?'Semana':'Mês'}</th>${P.map(p=>`<th class="${p===k?'cur':''}"><button data-act="irper" data-t="${t}" data-k="${p}">${lbl(p)}</button></th>`).join('')}<th>%</th></tr></thead><tbody>

    </tbody><tfoot><tr><th class="hn">Constância</th>${colPct.map((v,j)=>`<td class="num pc ${P[j]===k?'cur':''}">${v==null?'—':v+'%'}</td>`).join('')}<td></td></tr></tfoot></table></div>
  </div>
  <p class="xs muted">Contorno vermelho tracejado: período que passou sem marcação. Toque em qualquer bolinha para corrigir.</p></section>`;
  h+=sec('Desempenho',`<div class="card stack">${grafico(t,false)}<p class="xs muted">% dos itens feitos em cada ${t==='semanal'?'semana, nas últimas 12':'mês, nos últimos 12'}. A linha passa de um ano para o outro sem cortar.</p></div>`);

function rPend(){

function resumoAno(Y){
  const sv=S.servicos.filter(s=>s.data.slice(0,4)===Y);
  const gasto=sv.reduce((a,s)=>a+(+s.custo||0),0);
  const L=[...S.leituras].sort((a,b)=>a.data<b.data?-1:1);
  const dentro=L.filter(l=>l.data.slice(0,4)===Y), antes=L.filter(l=>l.data.slice(0,4)<Y).pop();
  const kmRod=dentro.length?(dentro[dentro.length-1].km-((antes||dentro[0]).km)):null;
  const ab=S.abast.filter(a=>a.data.slice(0,4)===Y); const comb=ab.reduce((a,x)=>a+(+x.valor||0),0);
  const porMes=Array.from({length:12},(_,m)=>sv.filter(s=>+s.data.slice(5,7)===m+1).reduce((a,s)=>a+(+s.custo||0),0)+ab.filter(a=>+a.data.slice(5,7)===m+1).reduce((a,x)=>a+(+x.valor||0),0));
  const porGrupo={}; sv.forEach(s=>{ const gs=s.itens.length?[...new Set(s.itens.map(i=>(ITENS.find(x=>x.id===i)||{}).grupo||'Outros'))]:['Outros']; gs.forEach(g=>{ porGrupo[g]=porGrupo[g]||{n:0,r:0}; porGrupo[g].n++; porGrupo[g].r+=(+s.custo||0)/gs.length; }); });
  const cons=t=>{ const ks=Object.keys(S.hab[t]||{}).filter(k=>k.slice(0,4)===Y&&k<=perAtual(t)); if(!ks.length) return null; const n=CHECKLISTS[t].itens.length; let ok=0,tot=0; ks.forEach(k=>{ CHECKLISTS[t].itens.forEach(i=>{ tot++; if(habGet(t,k,i.id)==='ok') ok++; }); }); return Math.round(ok/tot*100); };
  const trocas=sv.filter(s=>s.itens.some(i=>i!=='corrente')).length, lubs=sv.filter(s=>s.itens.includes('corrente')).length;
  return {sv,gasto,kmRod,comb,porMes,porGrupo,cs:cons('semanal'),cm:cons('mensal'),trocas,lubs,ab};
}
function rResumo(){
  const Y=ui.anoRes||String(new Date().getFullYear()), atualY=String(new Date().getFullYear());

function sugestoes(q){
  const nq=semAcento(q.trim()); const toks=nq.split(/\s+/).filter(Boolean);
  const usados=[...new Set(S.servicos.flatMap(s=>s.outro?s.outro.split(', '):[]))];
  const pool=[...ITENS.map(i=>({tipo:'item',id:i.id,t:i.nome,g:i.grupo})),...[...new Set([...usados,...EXTRAS])].map(t=>({tipo:'outro',t,g:usados.includes(t)?'Já usado':'Outro serviço'}))];
  const sel=ui.novo||{itens:[],outros:[]};
  let r=pool.filter(p=>!(p.tipo==='item'?sel.itens.includes(p.id):sel.outros.includes(p.t)));
  if(toks.length) r=r.filter(p=>{ const n=semAcento(p.t+' '+p.g); return toks.every(t=>n.includes(t)); });
  r=r.slice(0,7);
  if(q.trim() && !pool.some(p=>semAcento(p.t)===nq)) r.push({tipo:'novo',t:q.trim(),g:'Adicionar como novo'});
  return r;
}

      ultCheio=a; litros=0; combs=new Set(); } });
  return res;
}

const carregados={};
function script(src){ return carregados[src]||(carregados[src]=new Promise((ok,er)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>{ delete carregados[src]; er(new Error('Falha ao carregar '+src)); }; document.head.appendChild(s); })); }

/* ---- leitura do CRLV-e ---- */
async function lerCRLV(file){
  ui.crlv={st:'lendo'}; render();
  try{
    const sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;
    if(!sample) throw new Error('A leitura automática só funciona abrindo o app pelo Claude. Você ainda pode preencher os dados à mão.');
    let texto='', img=null;
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
      await script('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      await script('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
      const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
      for(let p=1;p<=Math.min(2,pdf.numPages);p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); texto+=tc.items.map(i=>i.str).join(' ')+'\n'; }
      const pg=await pdf.getPage(1), vp=pg.getViewport({scale:2}), cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      img=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    } else {
      const bmp=await createImageBitmap(file); const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
      img=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));
    }
    const lim=await sample.limits().catch(()=>null);
    const usarImg=img&&lim&&lim.images;
    if(!texto.trim() && !usarImg) throw new Error('Não consegui ler esse arquivo aqui. Tente o PDF original do CRLV-e.');
    const chaves=DOCCAMPOS.map(([k])=>k).join(', ');
    const prompt=`Você recebe um CRLV-e (Certificado de Registro e Licenciamento de Veículo) brasileiro de uma motocicleta${usarImg?' (imagem anexa)':''}${texto.trim()?' e o texto extraído dele abaixo':''}.
Extraia os dados do veículo e responda SOMENTE com um objeto JSON com estas chaves (strings, ou null se não encontrar): ${chaves}.
Regras: placa sem espaço (ex.: ABC1D23); anos com 4 dígitos; data_emissao no formato DD/MM/AAAA; cor em português como está no documento.
NÃO inclua nome, CPF ou CNPJ do proprietário, nem qualquer outro dado pessoal.
${texto.trim()?'\nTEXTO DO DOCUMENTO:\n'+texto.slice(0,8000):''}`;
    const dados=await sample.json(prompt,{images:usarImg?[img]:undefined,modelTier:'default'});
    if(!dados||typeof dados!=='object') throw new Error('Não encontrei os dados no documento.');
    const limpo={}; DOCCAMPOS.forEach(([k])=>{ if(dados[k]!=null&&String(dados[k]).trim()) limpo[k]=String(dados[k]).trim(); });
    if(!Object.keys(limpo).length) throw new Error('Não encontrei os dados no documento. Confira se é o CRLV-e.');
    ui.crlv={st:'ok',dados:limpo};
  }catch(e){ ui.crlv={st:'erro',erro:(e&&e.code==='not_granted')?'Você não permitiu a leitura pelo Claude. Dá para preencher à mão.':(e&&e.message)||'Não foi possível ler o documento.'}; }
  render();
}

  else if(a==='delok'){ S.servicos=S.servicos.filter(s=>s.id!==id); ui.delId=null; salvar(); render(); }
  else if(a==='fixlast'){ const v=ui.fixKm; S.leituras=S.leituras.filter(l=>l.km<=v); ui.fixKm=null; registrarLeitura(v); salvar(); flash('Leitura corrigida.',true); }
  else if(a==='fixno'){ ui.fixKm=null; ui.msg=''; render(); }
  else if(a==='leitedit'){ ui.editLeit=id; ui.delLeit=null; render(); }
  else if(a==='leitdel'){ ui.delLeit=id; ui.editLeit=null; render(); }
  else if(a==='leitno'){ ui.editLeit=null; ui.delLeit=null; render(); }
  else if(a==='leitdelok'){ S.leituras=S.leituras.filter(l=>l.id!==id); ui.delLeit=null; salvar(); render(); }
  else if(a==='editserv'){ const s=S.servicos.find(x=>x.id===id); if(!s) return; ui.novo={editId:s.id,itens:[...s.itens],outros:s.outro?s.outro.split(', '):[],data:s.data,km:s.km??'',custo:s.custo||'',local:s.local||'',obs:s.obs||''}; ui.form=true; ui.msg=''; render(); window.scrollTo(0,0); }
  else if(a==='cancelserv'){ ui.novo=null; ui.form=false; render(); }
  else if(a==='abedit'){ const x=S.abast.find(y=>y.id===id); if(!x) return; ui.ab={editId:x.id,data:x.data,km:x.km??'',litros:x.litros??'',valor:x.valor??'',comb:x.comb,cheio:!!x.cheio}; ui.msg=''; render(); window.scrollTo(0,0); }
  else if(a==='abno'){ ui.ab=null; render(); }
  else if(a==='abdel'){ ui.delAb=id; render(); }
  else if(a==='abdelno'){ ui.delAb=null; render(); }
  else if(a==='abdelok'){ S.abast=S.abast.filter(y=>y.id!==id); ui.delAb=null; salvar(); render(); }
  else if(a==='estilo'){ S.tema={...S.tema,estilo:b.dataset.e}; salvar(); render(); }
  else if(a==='modo'){ S.tema={...S.tema,modo:b.dataset.m}; salvar(); render(); }
  else if(a==='demo'){ entrarDemo(); }
  else if(a==='demosair'){ sairDemo(); }
  else if(a==='ajustes'){ temaAberto=true; aplicarTema(); window.scrollTo(0,0); }
  else if(a==='togitem'){ const o=new Set(S.tema.itensOcultos||[]); o.has(id)?o.delete(id):o.add(id); S.tema={...S.tema,itensOcultos:[...o]}; salvar(); render(); }
  else if(a==='exportar'){ const dados=demo||S; baixar(`garagem-fz25-backup-${hoje()}.json`,new Blob([JSON.stringify(dados,null,1)],{type:'application/json'})).then(()=>{ ui.bkMsg='ok:Backup baixado.'; render(); }).catch(e=>{ ui.bkMsg=e&&e.code==='declined'?'Download cancelado.':(e&&e.message)||'Não foi possível baixar.'; render(); }); }
  else if(a==='impok'){ S=norm(ui.imp.dados); ui.imp=null; ui.bkMsg='ok:Backup restaurado.'; salvar(); render(); }
  else if(a==='impno'){ ui.imp=null; render(); }
  else if(a==='sair'){ firebase.auth().signOut(); }
  else if(a==='login'){ entrarGoogle(); }
  else if(a==='instalar'&&instalarEvt){ instalarEvt.prompt(); instalarEvt.userChoice.finally(()=>{ instalarEvt=null; render(); }); }
  else if(a==='semconta'){ usuario=null; modo='local'; ui.semConta=true; render(); }
  else if(a==='temafechar'){ temaAberto=false; aplicarTema(); }
  else if(a==='taredit'){ const t=b.dataset.t; ui.tarEdit=ui.tarEdit===t?null:t; ui.tarDraft=CHECKLISTS[t].itens.map(x=>({...x})); render(); const e=document.getElementById('editor-tar'); if(e) e.scrollIntoView({block:'start'}); }
  else if(a==='tarcancel'){ ui.tarEdit=null; render(); }
  else if(a==='taradd'){ lerTar(); ui.tarDraft.push({id:'c_'+uid(),t:'',v:''}); render(); const i=document.getElementById('tar_t_'+(ui.tarDraft.length-1)); if(i) i.focus(); }
  else if(a==='tarrm'){ lerTar(); ui.tarDraft.splice(+b.dataset.i,1); render(); }
  else if(a==='tarmv'){ lerTar(); const i=+b.dataset.i, j=i+(+b.dataset.d), D=ui.tarDraft; [D[i],D[j]]=[D[j],D[i]]; render(); }
  else if(a==='tarsalvar'){ lerTar(); const t=b.dataset.t, L=ui.tarDraft.filter(x=>x.t.trim()).map(x=>({...x,t:x.t.trim(),v:(x.v||'').trim()})); if(!L.length) return flash('Deixe pelo menos uma tarefa.'); S.tarefas={...(S.tarefas||{}),[t]:L}; ui.tarEdit=null; salvar(); flash('Tarefas salvas.',true); }
  else if(a==='tarpadrao'){ const t=b.dataset.t; ui.tarDraft=ITENS_PADRAO[t].map(x=>({...x})); render(); }
  else if(a==='pendok'){ const x=(S.pend||[]).find(y=>y.id===id); if(x){ x.feita=hoje(); salvar(); flash('Pendência resolvida. Se teve custo, registre no histórico.',true); } }
  else if(a==='pendreabrir'){ const x=S.pend.find(y=>y.id===id); if(x){ x.feita=null; salvar(); render(); } }
  else if(a==='pendedit'){ ui.pendEdit=id; render(); }
  else if(a==='pendeditno'){ ui.pendEdit=null; render(); }
  else if(a==='pendrm'){ ui.pendDel=id; render(); }
  else if(a==='pendrmno'){ ui.pendDel=null; render(); }
  else if(a==='pendrmok'){ S.pend=S.pend.filter(y=>y.id!==id); ui.pendDel=null; salvar(); render(); }
  else if(a==='pendhist'){ const x=S.pend.find(y=>y.id===id); if(x){ novoServ(); ui.novo.outros=[x.t]; ui.novo.data=x.feita||hoje(); ui.novo.obs=x.obs||''; tab='historico'; render(); window.scrollTo(0,0); } }
  else if(a==='adddoc'){ S.docs.push({id:uid(),nome:'',venc:''}); render(); }
  else if(a==='pdf'){ ui.pdf.custos=document.getElementById('pdf_custos').checked; ui.pdf.doc=document.getElementById('pdf_doc').checked; gerarPDF(); }
  else if(a==='crlvno'){ ui.crlv=null; render(); }
  else if(a==='crlvok'){ const d=ui.crlv.dados;
    S.moto.doc=d; if(d.placa) S.moto.placa=d.placa.toUpperCase(); if(d.ano_modelo&&+d.ano_modelo) S.moto.ano=+d.ano_modelo; if(d.cor) S.moto.cor=d.cor.charAt(0).toUpperCase()+d.cor.slice(1).toLowerCase();
    ui.crlv=null; salvar(); flash('Dados do documento salvos.',true); }

});
document.addEventListener('input',e=>{ if(e.target.id==='sv_q') mostrarSug(); });
document.addEventListener('focusin',e=>{ if(e.target.id==='sv_q') mostrarSug(); });
document.addEventListener('keydown',e=>{
  if(e.target.id!=='sv_q') return;
  const box=document.getElementById('sv_sug'), bs=box?[...box.querySelectorAll('button')]:[]; let i=bs.findIndex(x=>x.classList.contains('on'));
  if(e.key==='Enter'){ e.preventDefault(); const sel=bs[i]||bs[0]; if(sel) addSug(sel.dataset.tipo,sel.dataset.id,sel.dataset.t); }
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!bs.length) return; bs.forEach(x=>x.classList.remove('on')); i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs[i].classList.add('on'); }
  else if(e.key==='Escape'&&box){ box.hidden=true; }
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-ck]'); if(c){ draft.pre=draft.pre||{}; draft.pre[c.dataset.ck]=c.checked; render(); return; }
  if(e.target.dataset&&e.target.dataset.sec){ const o=new Set(S.tema.ocultar||[]); e.target.checked?o.delete(e.target.dataset.sec):o.add(e.target.dataset.sec); S.tema={...S.tema,ocultar:[...o]}; salvar(); render(); return; }
  if(e.target.id==='impFile'&&e.target.files[0]){ e.target.files[0].text().then(t=>{ try{ const o=JSON.parse(t); if(!o||!Array.isArray(o.leituras)) throw 0; ui.imp={dados:o,resumo:`${plural((o.servicos||[]).length,'manutenção','manutenções')}, ${plural(o.leituras.length,'leitura de km','leituras de km')}`}; ui.bkMsg=''; }catch(x){ ui.bkMsg='Esse arquivo não é um backup do Garagem FZ25.'; } render(); }); return; }
  if(e.target.id==='crlvFile'&&e.target.files[0]){ lerCRLV(e.target.files[0]); return; }
  if(e.target.id==='pdf_custos') ui.pdf.custos=e.target.checked;
  if(e.target.id==='pdf_doc') ui.pdf.doc=e.target.checked;
  if(e.target.closest('[data-form="ab"]') && ['ab_l','ab_v'].includes(e.target.id)){ lerAb(); render(); }
});
// arrastar para o lado troca de semana/mês
let toque=null;
document.addEventListener('touchstart',e=>{ const z=e.target.closest('[data-swipe]'); if(!z||e.target.closest('.hab-wrap')) return; toque={t:z.dataset.swipe,x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
document.addEventListener('touchend',e=>{ if(!toque) return; const dx=e.changedTouches[0].clientX-toque.x, dy=e.changedTouches[0].clientY-toque.y, t=toque.t; toque=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ irPer(t,perMove(t,perVer(t),dx<0?1:-1)); } },{passive:true});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target.dataset.form, g=id=>document.getElementById(id);
  if(f==='km'){
    const v=parseInt(g('kmIn').value,10), km=kmAtual();
    if(!v||v<0) return flash('Digite a quilometragem do painel.');
    if(km!=null && v<km){ ui.fixKm=v; return flash(`${fmtKm(v)} km é menor que a última leitura (${fmtKm(km)} km). Se a anterior estava errada, corrija abaixo.`); }
    ui.fixKm=null; registrarLeitura(v); salvar(); flash('Quilometragem atualizada.',true);
  }
  else if(f==='leit'){
    const id=e.target.dataset.id, d=g('le_data').value, k=parseInt(g('le_km').value,10);
    if(!d||isNaN(k)||k<0) return flash('Preencha data e km.');
    const l=S.leituras.find(x=>x.id===id); if(l){ l.data=d; l.km=k; }
    S.leituras.sort((a,b)=>a.data<b.data?-1:1); ui.editLeit=null; salvar(); render();
  }
  else if(f==='ab'){
    lerAb(); const n=ui.ab;
    if(!n.data) return flash('Informe a data.');
    if(!n.litros && !n.valor) return flash('Preencha pelo menos litros ou valor.');
    const km=n.km===''?null:parseInt(n.km,10);
    const reg={id:n.editId||uid(),data:n.data,km,litros:n.litros===''?null:+n.litros,valor:n.valor===''?null:+n.valor,comb:n.comb,cheio:!!n.cheio};
    if(n.editId) S.abast=S.abast.map(x=>x.id===n.editId?reg:x); else S.abast.push(reg);
    if(S.abast.length>600) S.abast=S.abast.slice(-600);
    if(km!=null && (kmAtual()==null || km>kmAtual())) registrarLeitura(km,n.data);
    ui.ab=null; salvar(); flash(n.editId?'Abastecimento atualizado.':'Abastecimento salvo.',true);
  }
  else if(f==='serv'){
    lerNovo(); const n=ui.novo; const q=g('sv_q'); if(q&&q.value.trim()&&!n.outros.includes(q.value.trim())){ const s=sugestoes(q.value)[0]; if(s){ if(s.tipo==='item') n.itens.push(s.id); else n.outros.push(s.t); } }
    if(!n.itens.length && !n.outros.length) return flash('Digite o que foi feito e escolha uma sugestão.');
    if(!n.data) return flash('Informe a data.');
    const km=n.km===''?null:parseInt(n.km,10);
    const reg={id:n.editId||uid(),itens:[...n.itens],data:n.data,km,custo:n.custo===''?0:+n.custo,local:n.local.trim(),obs:n.obs.trim(),outro:n.outros.join(', ')};
    if(n.editId) S.servicos=S.servicos.map(s=>s.id===n.editId?reg:s); else S.servicos.push(reg);
    if(km!=null && (kmAtual()==null || km>kmAtual())) registrarLeitura(km,n.data);
    ui.novo=null; ui.form=false; salvar(); flash(n.editId?'Manutenção atualizada.':'Manutenção salva no histórico.',true);
  }
  else if(f==='pend'){
    const t=g('pn_t').value.trim(); if(!t) return flash('Escreva o que precisa resolver.');
    S.pend=[...(S.pend||[]),{id:uid(),t,prazo:(g('pn_p')&&g('pn_p').value)||null,obs:g('pn_o')?g('pn_o').value.trim():'',criada:hoje(),feita:null}];
    if(tab==='painel'){ ui.msgPend='Anotado.'; salvar(); render(); setTimeout(()=>{ ui.msgPend=''; render(); },2500); const i=document.getElementById('pn_t'); if(i) i.focus(); } else { salvar(); flash('Pendência anotada.',true); }
  }
  else if(f==='pendedit'){
    const x=S.pend.find(y=>y.id===e.target.dataset.id); if(x){ x.t=g('pe_t').value.trim()||x.t; x.prazo=g('pe_p').value||null; x.obs=g('pe_o').value.trim(); } ui.pendEdit=null; salvar(); render();
  }
  else if(f==='int'){
    const id=e.target.dataset.id, k=g('int_km').value, m=g('int_m').value;
    const mx=g('int_max').value; S.intervalos[id]={km:k===''?null:+k, kmMax:mx===''?null:+mx, meses:m===''?null:+m}; ui.editInt=null; salvar(); render();
  }
  else if(f==='moto'){
    S.moto={...S.moto,nome:g('mo_nome').value.trim()||'Fazer FZ25 ABS',ano:g('mo_ano').value?+g('mo_ano').value:null,placa:g('mo_placa').value.trim().toUpperCase(),cor:g('mo_cor').value.trim(),kmMes:g('mo_kms').value?+g('mo_kms').value:null,doc:{...(S.moto.doc||{}),renavam:g('mo_ren').value.trim(),chassi:g('mo_chassi').value.trim().toUpperCase()}};
    salvar(); flash('Dados salvos.',true);
  }
  else if(f==='docs'){
    S.docs=S.docs.map((d,i)=>({...d,nome:g('dn_'+i).value.trim(),venc:g('dv_'+i).value})).filter(d=>d.nome);
    salvar(); flash('Documentos salvos.',true);
  }
});

/* ============ INICIAR ============ */
/*INICIO_INIT*/
function carregarLocal(){ try{ const r=localStorage.getItem('garagem-fz25'); return r?JSON.parse(r):null; }catch(e){ return null; } }
S=norm(carregarLocal());
if(!PWA){ render(); setSync('','Neste aparelho'); }
else {
  render(); setSync('','Conectando');
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fsdb=firebase.firestore();
  try{ fsdb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  let unsub=null;
  window.entrarGoogle=function(){
    const pr=new firebase.auth.GoogleAuthProvider(); ui.loginErro='';
    firebase.auth().signInWithPopup(pr).catch(e=>{
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment') return firebase.auth().signInWithRedirect(pr);
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){ ui.loginErro='Não foi possível entrar: '+(e.message||e.code); render(); }
    });
  };
  firebase.auth().getRedirectResult().catch(e=>{ ui.loginErro='Não foi possível entrar: '+(e.message||e.code); render(); });
  firebase.auth().onAuthStateChanged(u=>{
    authPronto=true; if(unsub){ unsub(); unsub=null; }
    usuario=u;
    if(!u){ modo='local'; dbRef=null; setSync('','Sem conta'); render(); return; }
    ui.semConta=false; modo='db'; dbRef=fsdb.collection('garagem').doc(u.uid);
    unsub=dbRef.onSnapshot({includeMetadataChanges:true},snap=>{
      setSync(snap.metadata.fromCache?'busy':'on', snap.metadata.fromCache?'Offline':'Sincronizado');
      if(demo){ if(snap.exists) demo=norm(JSON.parse(JSON.stringify(snap.data()))); return; }
      if(saving||saveTimer||snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        const novo=norm(JSON.parse(JSON.stringify(snap.data())));
        if(JSON.stringify(novo)===JSON.stringify(S)) return;
        lerNovo(); lerAb(); S=novo;
      } else if(!snap.metadata.fromCache){ salvar(); } // primeira vez: sobe o que já existe neste aparelho
      if(!document.activeElement||!document.activeElement.matches('input,textarea,select')) render();
    }, err=>{ setSync('err','Sem conexão'); console.warn(err); });
    render();
  });
  addEventListener('online',()=>setSync('on','Sincronizado')); addEventListener('offline',()=>setSync('busy','Offline'));
}
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); instalarEvt=e; if(tab==='painel') render(); });
addEventListener('appinstalled',()=>{ instalarEvt=null; render(); });
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{ setInterval(()=>reg.update(),60*60*1000); });
  let recarregou=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(recarregou) return; recarregou=true; location.reload(); });
}
/*FIM_INIT*/
